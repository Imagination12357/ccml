name: ci-gates

on:
  push:
    paths:
      - ".github/workflows/ci-gates.yml"
      - "core/rust/**"
      - "bindings/python/**"
      - "bindings/node/**"
      - "tests/conformance/**"
      - "scripts/ci/**"
  pull_request:
    paths:
      - ".github/workflows/ci-gates.yml"
      - "core/rust/**"
      - "bindings/python/**"
      - "bindings/node/**"
      - "tests/conformance/**"
      - "scripts/ci/**"
  workflow_dispatch:

concurrency:
  group: ci-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Prime Cargo cache for offline runs
        working-directory: core/rust
        run: cargo fetch --locked

      - name: Run CI gates
        shell: bash
        timeout-minutes: 30
        run: bash scripts/ci/run-ci-gates.sh

      - name: Upload gate summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-summary
          path: artifacts/ci/gate-summary.md
