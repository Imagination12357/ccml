name: wasm-runtime-smoke

on:
  push:
    paths:
      - ".github/workflows/wasm-runtime-smoke.yml"
      - "core/rust/**"
      - "tests/wasm/**"
      - "tests/bindings/parity-smoke-cases.json"
      - "scripts/wasm/**"
  pull_request:
    paths:
      - ".github/workflows/wasm-runtime-smoke.yml"
      - "core/rust/**"
      - "tests/wasm/**"
      - "tests/bindings/parity-smoke-cases.json"
      - "scripts/wasm/**"

concurrency:
  group: wasm-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core/rust
            .

      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-wasm-bindgen-cli-${{ hashFiles('core/rust/Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run WASM runtime smoke
        shell: bash
        timeout-minutes: 30
        run: bash scripts/wasm/build-and-run-smoke.sh

      - name: Upload WASM smoke summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-smoke-summary
          path: artifacts/ci/wasm-smoke-summary.md
