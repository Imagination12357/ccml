[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccml"
version = "0.1.0"
description = "Parser and converter for CCML (Convenient Compatible Markup Language)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "lark>=1.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ccml = "ccml.parser:main"

[project.urls]
Homepage = "https://github.com/imagination12357/ccml"
Issues = "https://github.com/imagination12357/ccml/issues"