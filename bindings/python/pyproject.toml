[project]
name = "ccml-py"
version = "1.0.0"
description = "Thin Python adapter for ccml-ffi"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccml_py"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
