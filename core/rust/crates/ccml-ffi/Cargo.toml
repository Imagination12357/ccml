[package]
name = "ccml-ffi"
version = "1.0.0"
edition = "2024"
description = "C ABI bridge for the CCML Rust core."
license = "Apache-2.0"
repository = "https://github.com/Imagination12357/ccml"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ccml-core = { path = "../ccml-core", version = "1.0.0" }

[dev-dependencies]
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
serde_json = "1"
